services:
  # 1. Backend FastAPI Service
  - type: web
    runtime: python
    name: sentinel-backend
    repo: https://github.com/karan68/sentinel-travel-risk-lab
    branch: main
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CORS_ALLOW_ORIGINS
        fromService:
          name: sentinel-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  # 2. Frontend React static site
  - type: web
    runtime: static
    name: sentinel-frontend
    repo: https://github.com/karan68/sentinel-travel-risk-lab
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
    routes:
      # Support client-side routing fallback for React Single Page App
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: sentinel-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
